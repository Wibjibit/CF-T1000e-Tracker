name: Webapp CI

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'decoder/**'
      - 'docs/**'
      - '.github/workflows/webapp-ci.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - 'decoder/**'
      - 'docs/**'
      - '.github/workflows/webapp-ci.yml'

defaults:
  run:
    working-directory: webapp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
